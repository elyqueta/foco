<div class="min-h-screen bg-surface-page p-4 md:p-6">
  <div class="relative mx-auto flex min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] max-w-[1440px] overflow-clip rounded-[28px] bg-surface-app shadow-card">
    <app-sidebar />

    <div class="flex min-w-0 flex-1 flex-col px-5 py-6 pb-28 lg:px-10 lg:pb-8">
      <app-topbar />
      <main class="mt-8 min-w-0 flex-1">
        <router-outlet />
      </main>
    </div>
  </div>
</div>

@if (modal.open()) {
  <app-modal (close)="closeModal()">
    <h2 class="text-[18px] font-bold text-ink mb-4">Nova tarefa</h2>
    <app-task-form [initialDueDate]="initialDueDate()" (submit)="onTaskSubmit($event)" (cancel)="closeModal()" />
  </app-modal>
}

@if (confirm.open()) {
  <app-confirm-dialog
    [title]="confirm.config().title"
    [message]="confirm.config().message"
    [type]="confirm.config().type ?? 'info'"
    [confirmLabel]="confirm.config().confirmLabel ?? 'Confirmar'"
    [cancelLabel]="confirm.config().cancelLabel ?? 'Cancelar'"
    (confirm)="confirm.onConfirm()"
    (cancel)="confirm.onCancel()"
  />
}

@if (focusActive()) {
  <div class="fixed bottom-4 right-4 z-50 w-[calc(100%-32px)] max-w-[360px] rounded-2xl border border-surface-line bg-surface-card p-4 shadow-float">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0 flex-1">
        <p class="text-[10px] font-semibold uppercase tracking-wide text-ink-400">Modo foco</p>
        <p class="mt-0.5 text-[13px] font-semibold text-ink truncate">{{ focusTask()?.title }}</p>
      </div>
      <div class="shrink-0 text-right">
        <p class="text-[20px] font-extrabold leading-none text-ink">{{ formatTick(focusTick()) }}</p>
      </div>
    </div>
    <div class="mt-3 flex items-center gap-2">
      <a [routerLink]="['/tarefas', focusTask()?.id]" class="flex h-9 flex-1 items-center justify-center rounded-xl bg-surface-app text-[12px] font-semibold text-ink transition hover:bg-surface-line">Ver tarefa</a>
      @if (focusPaused()) {
        <button type="button" (click)="resumeFocus()" class="flex h-9 flex-1 items-center justify-center rounded-xl bg-brand text-[12px] font-semibold text-white transition hover:bg-brand-600">Continuar</button>
      } @else {
        <button type="button" (click)="pauseFocus()" class="flex h-9 flex-1 items-center justify-center rounded-xl bg-surface-app text-[12px] font-semibold text-ink transition hover:bg-surface-line">Pausar</button>
      }
      <button type="button" (click)="stopFocus()" class="flex h-9 flex-1 items-center justify-center rounded-xl bg-danger-soft text-[12px] font-semibold text-danger transition hover:bg-danger/10">Parar</button>
    </div>
  </div>
}
