<div class="min-h-screen bg-surface-page p-4 md:p-6 dark:bg-[#0F0E24]">
  <div
    class="relative mx-auto flex min-h-[calc(100vh-32px)] md:min-h-[calc(100vh-48px)] max-w-[1440px] overflow-hidden rounded-[28px] bg-surface-app shadow-card dark:bg-[#14132E]"
  >
    <app-sidebar />

    <div class="flex min-w-0 flex-1 flex-col px-5 py-6 pb-28 lg:px-10 lg:pb-8">
      <app-topbar />
      <main class="mt-8 min-w-0 flex-1">
        <router-outlet />
      </main>
    </div>
  </div>
</div>

@if (modal.open()) {
  <app-modal (close)="closeModal()">
    <h2 class="text-[18px] font-bold text-ink mb-4">Nova tarefa</h2>
    <app-task-form (submit)="onTaskSubmit($event)" (cancel)="closeModal()" />
  </app-modal>
}
