<nav class="fixed inset-x-4 bottom-4 z-40 flex h-16 items-center justify-around rounded-3xl bg-brand px-3 shadow-float lg:static lg:inset-auto lg:my-10 lg:h-auto lg:w-[72px] lg:shrink-0 lg:flex-col lg:justify-start lg:gap-3 lg:rounded-l-none lg:rounded-r-[40px] lg:px-0 lg:py-6 lg:shadow-none lg:sticky lg:top-10 lg:self-start lg:h-[calc(100vh-128px)] lg:max-h-[720px]">
  @for (item of items; track item.path) {
    <a
      [routerLink]="item.path"
      routerLinkActive="!bg-white !text-brand shadow-float"
      [routerLinkActiveOptions]="{ exact: item.exact }"
      [attr.aria-label]="item.label"
      class="grid h-11 w-11 place-items-center rounded-2xl text-white/70 transition duration-150 hover:bg-white/15 hover:text-white focus-visible:ring-2 focus-visible:ring-white/60"
    >
      <lucide-icon [name]="item.icon" class="h-5 w-5" [strokeWidth]="1.75" />
    </a>
  }
</nav>
