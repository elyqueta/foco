<header class="flex flex-wrap items-center justify-between gap-4">
  <!-- Tabs -->
  <div class="hidden items-center gap-6 md:flex">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="!text-ink font-semibold"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        class="flex items-center gap-2 text-[13px] font-medium text-ink-500 transition hover:text-ink"
      >
        <app-icon [name]="tab.icon" [size]="16" />
        {{ tab.label }}
      </a>
    }
  </div>

  <!-- Pesquisa -->
  <div class="relative order-last w-full md:order-none md:w-[260px]">
    <app-icon name="search" [size]="16" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />
    <input
      id="search"
      #search
      type="text"
      [value]="searchQuery()"
      (input)="onSearch($event)"
      (keydown.enter)="onSearchEnter()"
      placeholder="Pesquisar tarefa ou projeto"
      aria-label="Pesquisar"
      class="h-10 w-full rounded-xl border border-surface-line bg-surface-card pl-9 pr-3 text-sm text-ink placeholder:text-ink-400 focus:border-brand focus:outline-none focus:ring-2 focus:ring-brand/30"
    />
    @if (searchQuery()) {
      <app-button variant="ghost" size="sm" icon="x" label="Limpar pesquisa" [iconOnly]="true" buttonClass="absolute right-1 top-1/2 -translate-y-1/2" (click)="clearSearch()"></app-button>
    }
    <app-search-dropdown [searchQuery]="searchQuery()" (clearSearch)="clearSearch()" />
  </div>

  <!-- Ações -->
  <div class="flex flex-wrap items-center gap-3 max-[359px]:gap-1.5">
    <app-theme-toggle />

    <app-button variant="secondary" size="sm" icon="download" label="Exportar" (click)="showExportDialog.set(true)"></app-button>

    <app-button variant="dark" icon="plus" label="Nova tarefa" (click)="openNewTask()"></app-button>

    <a [routerLink]="['/notificacoes']" aria-label="Notificações" title="Notificações"
      class="relative grid h-10 w-10 place-items-center rounded-xl text-ink-500 transition hover:bg-surface-app focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand/40">
      <app-icon name="bell" [size]="20" />
      @if (unreadNotifications() > 0) {
        <span class="absolute right-1.5 top-1.5 grid h-4 min-w-4 place-items-center rounded-full bg-danger px-1 text-[10px] font-bold text-white">{{ unreadNotifications() }}</span>
      }
    </a>

    <div class="relative">
      <app-button
        data-user-menu
        variant="secondary"
        icon="user-round"
        [label]="'Abrir menu de ' + userName"
        [text]="userName.split(' ')[0]"
        [ariaExpanded]="menuOpen()"
        buttonClass="shadow-card"
        (click)="menuOpen.set(!menuOpen())"
      ></app-button>
      @if (menuOpen()) {
        <div class="absolute right-0 top-12 z-50 w-[220px] rounded-2xl border border-surface-line bg-surface-card p-2 shadow-float">
          <div class="border-b border-surface-line px-3 pt-2 pb-2">
            <p class="text-[13px] font-semibold text-ink">{{ userName }}</p>
            <p class="text-[11px] text-ink-400">{{ auth.user()?.email ?? '' }}</p>
          </div>
          <a routerLink="/notificacoes" class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-left text-[12px] font-semibold transition hover:bg-surface-app text-ink">
            <app-icon name="bell" [size]="16" /> Notificações
          </a>
          <a routerLink="/definicoes" class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-left text-[12px] font-semibold transition hover:bg-surface-app text-ink">
            <app-icon name="settings" [size]="16" /> Definições
          </a>
          <app-button variant="ghost" size="sm" icon="log-out" label="Terminar sessão" [iconOnlyBelow]="null" buttonClass="w-full justify-start !text-danger hover:!bg-danger-soft" (click)="logout()"></app-button>
        </div>
      }
    </div>
  </div>
</header>

@if (showExportDialog()) {
  <app-export-dialog (close)="showExportDialog.set(false)" />
}
