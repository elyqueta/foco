<header class="flex flex-wrap items-center justify-between gap-4">
  <!-- Tabs -->
  <div class="hidden items-center gap-6 md:flex">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="!text-ink font-semibold"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        class="flex items-center gap-2 text-[13px] font-medium text-ink-500 transition hover:text-ink"
      >
        <lucide-icon [name]="tab.icon" class="h-4 w-4" [strokeWidth]="1.75" />
        {{ tab.label }}
      </a>
    }
  </div>

  <!-- Pesquisa -->
  <div class="relative order-last w-full md:order-none md:w-[260px]">
    <div class="relative flex items-center">
      <lucide-icon name="search" class="pointer-events-none absolute left-4 h-4 w-4 text-ink-400" />
      <input
        id="search"
        type="text"
        [value]="searchQuery()"
        (input)="onSearch($event)"
        (keydown.enter)="onSearchEnter()"
        placeholder="Pesquisar tarefa ou projeto"
        aria-label="Pesquisar"
        class="h-10 w-full rounded-xl border border-surface-line bg-surface-card pl-10 pr-10 text-[13px] text-ink placeholder:text-ink-400 focus:outline-none focus:ring-2 focus:ring-brand/30"
      />
      @if (searchQuery()) {
        <button type="button" (click)="clearSearch()" class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full p-1 text-ink-400 hover:text-ink transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="18" y2="6"/></svg>
        </button>
      }
    </div>
    <app-search-dropdown [searchQuery]="searchQuery()" (clearSearch)="clearSearch()" />
  </div>

  <!-- Ações -->
  <div class="flex items-center gap-3">
    <div class="flex h-9 items-center rounded-xl bg-surface-card p-1">
      <button type="button" (click)="setTheme('light')"
        [class]="theme() === 'light' ? 'rounded-lg bg-brand-100 px-3 py-1 text-[12px] font-semibold text-brand' : 'rounded-lg px-3 py-1 text-[12px] text-ink-500'">
        Claro
      </button>
      <button type="button" (click)="setTheme('dark')"
        [class]="theme() === 'dark' ? 'rounded-lg bg-brand-100 px-3 py-1 text-[12px] font-semibold text-brand' : 'rounded-lg px-3 py-1 text-[12px] text-ink-500'">
        Escuro
      </button>
    </div>

    <button type="button" (click)="exportData()"
      class="hidden h-9 items-center gap-2 rounded-xl border border-surface-line bg-surface-card px-4 text-[12px] font-semibold text-ink-500 transition hover:text-ink sm:flex">
      <lucide-icon name="download" class="h-4 w-4" />
      Exportar
    </button>

    <button type="button" (click)="openNewTask()"
      class="h-10 rounded-xl bg-strong px-5 text-[13px] font-semibold text-white shadow-card transition hover:opacity-90 focus-visible:ring-2 focus-visible:ring-brand/40">
      Nova tarefa
    </button>
  </div>
</header>
