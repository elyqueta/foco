<header class="flex flex-wrap items-center justify-between gap-4">
  <!-- Tabs -->
  <div class="hidden items-center gap-6 md:flex">
    @for (tab of tabs; track tab.path) {
      <a
        [routerLink]="tab.path"
        routerLinkActive="!text-ink font-semibold"
        [routerLinkActiveOptions]="{ exact: tab.exact }"
        class="flex items-center gap-2 text-[13px] font-medium text-ink-500 transition hover:text-ink"
      >
        <app-icon [name]="tab.icon" [size]="16" />
        {{ tab.label }}
      </a>
    }
  </div>

  <!-- Pesquisa -->
  <div class="relative order-last w-full md:order-none md:w-[260px]">
    <app-icon name="search" [size]="16" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-ink-400" />
    <input
      id="search"
      #search
      type="text"
      [value]="searchQuery()"
      (input)="onSearch($event)"
      (keydown.enter)="onSearchEnter()"
      placeholder="Pesquisar tarefa ou projeto"
      aria-label="Pesquisar"
      class="h-10 w-full rounded-xl border border-surface-line bg-surface-card pl-9 pr-3 text-sm text-ink placeholder:text-ink-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
    />
    @if (searchQuery()) {
      <button type="button" (click)="clearSearch()" aria-label="Limpar pesquisa" class="absolute right-3 top-1/2 -translate-y-1/2 rounded-full p-1 text-ink-400 hover:text-ink transition">
          <app-icon name="x" [size]="14" />
      </button>
    }
    <app-search-dropdown [searchQuery]="searchQuery()" (clearSearch)="clearSearch()" />
  </div>

  <!-- Ações -->
  <div class="flex items-center gap-3">
    <app-theme-toggle />

    <button type="button" (click)="showExportDialog.set(true)"
      class="hidden h-9 items-center gap-2 rounded-xl border border-surface-line bg-surface-card px-4 text-sm font-medium text-ink-500 transition hover:bg-surface-app hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 sm:flex">
      <app-icon name="download" [size]="16" /> Exportar
    </button>

    <button type="button" (click)="openNewTask()"
      class="inline-flex h-10 items-center gap-2 rounded-xl bg-ink px-4 text-sm font-semibold text-white shadow-sm transition hover:bg-ink/90 active:scale-[.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 focus-visible:ring-offset-2">
      <app-icon name="plus" [size]="16" /> Nova tarefa
    </button>

    <button type="button" [routerLink]="['/notificacoes']" aria-label="Notificações"
      class="relative grid h-10 w-10 place-items-center rounded-xl text-ink-500 transition hover:bg-surface-app focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
      <app-icon name="bell" [size]="20" />
      @if (unreadNotifications() > 0) {
        <span class="absolute right-1.5 top-1.5 grid h-4 min-w-4 place-items-center rounded-full bg-danger px-1 text-[10px] font-bold text-white">{{ unreadNotifications() }}</span>
      }
    </button>

    <div class="relative">
      <button type="button" (click)="menuOpen.set(!menuOpen())" data-user-menu
        class="flex h-10 items-center gap-2 rounded-xl bg-surface-card pl-1 pr-3 shadow-card transition hover:opacity-90">
        <div class="grid h-8 w-8 place-items-center rounded-lg bg-brand text-[12px] font-bold text-white">{{ initials(userName) }}</div>
        <span class="hidden text-[12px] font-semibold text-ink md:block">{{ userName.split(' ')[0] }}</span>
      </button>
      @if (menuOpen()) {
        <div class="absolute right-0 top-12 z-50 w-[220px] rounded-2xl border border-surface-line bg-surface-card p-2 shadow-float">
          <div class="border-b border-surface-line px-3 pt-2 pb-2">
            <p class="text-[13px] font-semibold text-ink">{{ userName }}</p>
            <p class="text-[11px] text-ink-400">{{ auth.user()?.email ?? '' }}</p>
          </div>
          <a routerLink="/notificacoes" class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-left text-[12px] font-semibold transition hover:bg-surface-app text-ink">
            <app-icon name="bell" [size]="16" /> Notificações
          </a>
          <a routerLink="/definicoes" class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-left text-[12px] font-semibold transition hover:bg-surface-app text-ink">
            <app-icon name="settings" [size]="16" /> Definições
          </a>
          <button type="button" (click)="logout()" class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-left text-[12px] font-semibold text-danger transition hover:bg-surface-app">
            <app-icon name="log-out" [size]="16" /> Terminar sessão
          </button>
        </div>
      }
    </div>
  </div>
</header>

@if (showExportDialog()) {
  <app-export-dialog (close)="showExportDialog.set(false)" />
}
