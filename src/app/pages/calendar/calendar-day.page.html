<div class="mt-8 max-w-4xl">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <app-button variant="ghost" size="sm" icon="arrow-left" label="Voltar ao calendário" [iconOnly]="true" (click)="back()"></app-button>
        <h2 class="text-[18px] font-bold text-ink">Tarefas para {{ dayLabel() }}</h2>
      </div>
      @if (canAddTask()) {
        <app-button size="sm" icon="plus" label="Adicionar tarefa" (click)="addTask()"></app-button>
      }
    </div>

    @if (tasks().length === 0) {
      <app-empty-state
        icon="calendar-days"
        title="Sem tarefas neste dia"
        [message]="canAddTask() ? 'Adiciona a tua primeira tarefa para ' + dayLabel() + '.' : 'Não é possível adicionar tarefas numa data passada ou inválida.'"
        [actionLabel]="canAddTask() ? 'Adicionar tarefa' : null"
        (actionClick)="addTask()"
      />
  } @else {
    <div class="flex flex-col gap-2">
      @for (t of tasks(); track t.id) {
        <div class="flex items-center gap-4 rounded-2xl border border-surface-line bg-surface-card px-4 py-3 transition hover:shadow-card">
          <input type="checkbox" class="h-4 w-4 rounded accent-brand" [checked]="t.status === 'done'" (click)="$event.stopPropagation(); toggleTask(t.id)" />
          <div class="min-w-0 flex-1">
            <p class="truncate text-[14px] font-semibold text-ink" [class.line-through]="t.status === 'done'" [class.text-ink-400]="t.status === 'done'">{{ t.title }}</p>
            <p class="text-[11px] text-ink-400">{{ formatDateTime(t.dueDate) }} · {{ t.category }}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <app-button variant="ghost" size="sm" icon="pencil" label="Editar" (click)="$event.stopPropagation(); editTask(t.id)"></app-button>
            <app-button variant="danger" size="sm" icon="trash-2" label="Eliminar" (click)="$event.stopPropagation(); deleteTask(t.id)"></app-button>
          </div>
        </div>
      }
    </div>
  }
</div>
