<div class="mt-8 max-w-4xl">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <app-button variant="ghost" size="sm" icon="chevron-left" label="Mês anterior" [iconOnly]="true" (click)="prevMonth()"></app-button>
      <span class="text-[18px] font-bold text-ink">{{ monthLabel() }}</span>
      <app-button variant="ghost" size="sm" icon="chevron-right" label="Mês seguinte" [iconOnly]="true" (click)="nextMonth()"></app-button>
    </div>
    <app-button variant="secondary" size="sm" icon="calendar-days" label="Hoje" (click)="goToday()"></app-button>
  </div>
  <div class="grid grid-cols-7 gap-2">
    @for (label of weekLabels(); track label) {
      <div class="text-[11px] font-bold uppercase text-ink-400 text-center pb-2">{{ label }}</div>
    }
  </div>
  <div class="grid grid-cols-7 gap-2">
    @for (day of calendarDays(); track day.date.toISOString()) {
      <button type="button" (click)="openDay(toISODate(day.date))" class="min-h-[96px] rounded-xl border p-2 text-left transition" [class.border-surface-line]="day.inMonth" [class.opacity-40]="!day.inMonth" [class.bg-surface-card]="day.inMonth" [class.border-brand/50]="toISODate(day.date) === selectedDate()" [class.bg-brand-50]="toISODate(day.date) === selectedDate()">
        <span class="text-[12px] font-semibold text-ink">{{ day.date.getDate() }}</span>
        <div class="mt-1 flex flex-col gap-1">
          @for (t of day.tasks.slice(0, 3); track t.id) {
            <span class="block truncate rounded-md px-2 py-0.5 text-[10px] font-medium"
                  [class]="t.status === 'done' ? 'bg-success-soft text-success line-through' : 'bg-brand-100 text-brand-fg'">
              {{ t.title }}
            </span>
          }
          @if (day.tasks.length > 3) {
            <span class="text-[10px] text-ink-400">+{{ day.tasks.length - 3 }}</span>
          }
        </div>
      </button>
    }
  </div>
</div>
