<div class="flex h-full min-w-0 flex-col rounded-[20px] bg-surface-card p-5 shadow-card">
  <div class="flex items-center justify-between mb-4 min-w-0">
    <h3 class="truncate text-[16px] font-bold text-ink">{{ title() }}</h3>
    @if (actionLabel()) {
      <button class="shrink-0 text-[12px] text-ink-400 hover:text-brand transition" (click)="actionClick.emit()">{{ actionLabel() }}</button>
    }
  </div>
  <ng-content />
</div>
