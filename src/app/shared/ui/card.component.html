<div class="flex h-full min-w-0 flex-col rounded-3xl bg-surface-card p-6 shadow-card ring-1 ring-ink/10">
  <div class="flex items-center justify-between mb-4 min-w-0">
    <h3 class="truncate text-base font-semibold text-ink">{{ title() }}</h3>
    @if (actionLabel()) {
      <button class="shrink-0 text-sm font-medium text-ink-500 hover:text-primary transition" (click)="actionClick.emit()">{{ actionLabel() }}</button>
    }
  </div>
  <ng-content />
</div>
