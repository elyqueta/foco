@if (active()) {
  <div
    class="fixed z-50 w-[280px] max-w-[calc(100vw-24px)] touch-none select-none lg:w-[360px] lg:max-w-[360px]"
    [class.cursor-grabbing]="dragging()"
    [class.cursor-grab]="!dragging()"
    [style.left.px]="position().x"
    [style.top.px]="position().y"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
  >
    <div class="rounded-2xl border border-surface-line bg-surface-card shadow-float lg:hidden">
      <div
        class="flex items-center gap-2 p-2.5"
      >
        <app-icon name="target" [size]="18" class="text-brand" />
        <span class="min-w-0 flex-1 truncate text-xs font-semibold text-ink">{{ taskTitle() }}</span>
        <span class="shrink-0 text-lg font-extrabold tabular-nums text-ink">{{ formatTick(tick()) }}</span>
        @if (paused()) {
          <app-button size="sm" icon="play" label="Continuar temporizador" [iconOnly]="true" buttonClass="h-8 w-8" (click)="resume()"></app-button>
        } @else {
          <app-button size="sm" variant="secondary" icon="pause" label="Pausar temporizador" [iconOnly]="true" buttonClass="h-8 w-8" (click)="pause()"></app-button>
        }
        <app-button size="sm" variant="danger" icon="square" label="Parar temporizador" [iconOnly]="true" buttonClass="h-8 w-8" (click)="stop()"></app-button>
      </div>
    </div>

    <div
      class="hidden rounded-2xl border border-surface-line bg-surface-card shadow-float lg:block"
    >
      <div class="rounded-t-[22px] bg-surface-app/60 p-3">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <p class="text-[10px] font-semibold uppercase tracking-wide text-ink-400">Modo foco</p>
            <p class="mt-0.5 truncate text-sm font-semibold text-ink">{{ taskTitle() }}</p>
          </div>
          <div class="shrink-0 text-right">
            <p class="text-[20px] font-extrabold leading-none text-ink">{{ formatTick(tick()) }}</p>
          </div>
        </div>
      </div>
      <div class="p-3">
        <div class="mt-3 flex items-center gap-2">
          <a [routerLink]="['/tarefas', taskId()]" class="flex h-9 flex-1 items-center justify-center rounded-xl bg-surface-app px-3 text-xs font-semibold text-ink transition hover:bg-surface-line">Ver tarefa</a>
          @if (paused()) {
            <app-button size="sm" buttonClass="flex-1" icon="play" label="Continuar" [iconOnlyBelow]="null" (click)="resume()"></app-button>
          } @else {
            <app-button size="sm" variant="secondary" buttonClass="flex-1" icon="pause" label="Pausar" [iconOnlyBelow]="null" (click)="pause()"></app-button>
          }
          <app-button size="sm" variant="danger" buttonClass="flex-1" icon="square" label="Parar" [iconOnlyBelow]="null" (click)="stop()"></app-button>
        </div>
      </div>
    </div>
  </div>
}
