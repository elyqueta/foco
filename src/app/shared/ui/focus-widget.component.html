@if (active()) {
  <div
    class="fixed z-50 w-[calc(100%-32px)] max-w-[360px] touch-none select-none"
    [class]="'rounded-2xl border border-surface-line bg-surface-card shadow-float ' + (dragging() ? 'cursor-grabbing' : 'cursor-grab')"
    [style]="'left: ' + position().x + 'px; top: ' + position().y + 'px; transition: ' + (dragging() ? 'none' : 'left 0.2s ease-out, top 0.2s ease-out')"
  >
    <div
      class="rounded-t-[22px] bg-surface-app/60 p-3"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp($event)"
    >
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0 flex-1">
          <p class="text-[10px] font-semibold uppercase tracking-wide text-ink-400">Modo foco</p>
          <p class="mt-0.5 text-sm font-semibold text-ink truncate">{{ taskTitle() }}</p>
        </div>
        <div class="shrink-0 text-right">
          <p class="text-[20px] font-extrabold leading-none text-ink">{{ formatTick(tick()) }}</p>
        </div>
      </div>
    </div>
    <div class="p-3">
      <div class="mt-3 flex items-center gap-2">
        <a [routerLink]="['/tarefas', taskId()]" class="flex h-9 flex-1 items-center justify-center rounded-xl bg-surface-app px-3 text-xs font-semibold text-ink transition hover:bg-surface-line">Ver tarefa</a>
        @if (paused()) {
          <app-button size="sm" buttonClass="flex-1" icon="play" label="Continuar" [iconOnlyBelow]="null" (click)="resume()"></app-button>
        } @else {
          <app-button size="sm" variant="secondary" buttonClass="flex-1" icon="pause" label="Pausar" [iconOnlyBelow]="null" (click)="pause()"></app-button>
        }
        <app-button size="sm" variant="danger" buttonClass="flex-1" icon="square" label="Parar" [iconOnlyBelow]="null" (click)="stop()"></app-button>
      </div>
    </div>
  </div>
}
