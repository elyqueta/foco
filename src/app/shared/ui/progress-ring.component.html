<svg class="h-10 w-10 sm:h-[52px] sm:w-[52px]" viewBox="0 0 36 36" role="img" [attr.aria-label]="'Progresso: ' + displayPercent() + '%'">
  <circle cx="18" cy="18" r="15.5" fill="none" stroke-width="2.5" class="stroke-brand/15" />
  <circle
    cx="18"
    cy="18"
    r="15.5"
    fill="none"
    stroke-width="2.5"
    stroke-linecap="round"
    [attr.stroke-dasharray]="circumference"
    [attr.stroke-dashoffset]="offset()"
    class="-rotate-90 origin-center transition-[stroke-dashoffset] duration-500"
    [class.stroke-brand]="!isOverdue() && displayPercent() < 60"
    [class.stroke-success]="!isOverdue() && displayPercent() >= 60"
    [class.stroke-danger]="isOverdue()"
  />
  <text x="18" y="18" text-anchor="middle" dy=".35em" class="fill-ink text-[8px] font-bold sm:text-[9px]">{{ displayPercent() }}%</text>
</svg>
