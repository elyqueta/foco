<a [routerLink]="['/tarefas', task().id]" class="group flex items-center gap-4 rounded-2xl border border-surface-line bg-surface-card px-4 py-3 transition hover:border-brand/30 hover:shadow-sm">
  <input type="checkbox" class="h-5 w-5 rounded-md border-ink-300 text-brand focus:ring-brand/40" [checked]="task().status === 'done'" (click)="$event.stopPropagation(); toggle.emit(task().id)" />
  <div class="min-w-0 flex-1">
    <p class="truncate text-sm font-semibold text-ink" [class.line-through]="task().status === 'done'" [class.text-ink-400]="task().status === 'done'">{{ task().title }}</p>
    @if (taskMeta().length > 0) {
      <p class="mt-0.5 flex items-center gap-1.5 text-xs text-ink-500">
        <app-icon name="clock" [size]="12" /> {{ taskMeta().join(' · ') }}
      </p>
    }
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <app-badge-urgency [urgency]="task().urgency" [canPostpone]="task().canPostpone" />
    <app-badge-category [category]="task().category" />
  </div>
  <app-icon name="chevron-right" [size]="16" class="text-ink-300 transition group-hover:text-brand" />
</a>
