<a [routerLink]="['/tarefas', task().id]" class="group flex w-full min-w-0 flex-col gap-3 rounded-2xl border border-surface-line bg-surface-card px-3 py-3 transition hover:border-brand/30 hover:shadow-sm sm:flex-row sm:items-center sm:gap-4 sm:px-4">
  <div class="flex min-w-0 flex-1 items-start gap-3">
    <input type="checkbox" class="mt-0.5 h-5 w-5 shrink-0 rounded-md border-ink-300 text-brand focus:ring-brand/40" [checked]="task().status === 'done'" (click)="$event.stopPropagation(); toggle.emit(task().id)" />
    <div class="min-w-0 flex-1">
      <p class="break-words text-sm font-semibold leading-snug text-ink" [class.line-through]="task().status === 'done'" [class.text-ink-400]="task().status === 'done'">{{ task().title }}</p>
      @if (taskMeta().length > 0) {
        <p class="mt-1 flex flex-wrap items-center gap-1 text-[11px] leading-relaxed text-ink-500">
          <app-icon name="clock" [size]="12" class="shrink-0" />
          <span class="break-words">{{ taskMeta().join(' · ') }}</span>
        </p>
      }
    </div>
  </div>

  <div class="flex items-center justify-between gap-2 sm:justify-end">
    <div class="flex flex-wrap items-center gap-2">
      <app-badge-urgency [urgency]="task().urgency" [canPostpone]="task().canPostpone" />
      <app-badge-category [category]="task().category" />
    </div>
    <app-icon name="chevron-right" [size]="16" class="hidden text-ink-300 transition group-hover:text-brand sm:block" />
  </div>
</a>
