<a [routerLink]="['/tarefas', task().id]" class="flex items-center gap-4 rounded-2xl border border-surface-line bg-surface-card px-4 py-3 transition hover:shadow-card">
  <input type="checkbox" class="h-4 w-4 rounded accent-brand" [checked]="task().status === 'done'" (click)="$event.stopPropagation(); toggle.emit(task().id)" />
  <div class="min-w-0 flex-1">
    <p class="truncate text-[14px] font-semibold text-ink" [class.line-through]="task().status === 'done'" [class.text-ink-400]="task().status === 'done'">{{ task().title }}</p>
    @if (taskMeta().length > 0) {
      <p class="text-[11px] text-ink-400">{{ taskMeta().join(' · ') }}</p>
    }
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <app-badge-urgency [urgency]="task().urgency" [canPostpone]="task().canPostpone" />
    <app-badge-category [category]="task().category" />
  </div>
  <lucide-icon name="chevron-right" class="h-4 w-4 text-ink-300" />
</a>
